<title>배송현황 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#ffffff; --text:#201e1d; --accent:#ec3013;
    --accent-100:#fff2ef; --accent-600:#dd2b0f; --accent-700:#ae1800;
    --n200:#eae7e7; --n300:#d7d3d3; --n400:#bab6b6; --n500:#9b9797; --n600:#7d7979; --n700:#605d5d;
    --shadow-lg:0 12px 32px rgba(45,43,43,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Archivo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-100)}
  button{font:inherit}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h1,h2,h3,p{margin:0}
  .num{font-variant-numeric:tabular-nums}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 32px;border-bottom:1px solid var(--text)}
  .mark{font-weight:800;font-size:16px;letter-spacing:-.02em;text-transform:uppercase}
  .mark-sub{font-size:12.5px;font-weight:500;color:var(--n700);margin-left:12px}
  .sync{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--n600)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px}
  .chip.ok{color:var(--n700);background:var(--n200)}
  .chip.bad{color:#fff;background:var(--accent)}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;padding:12px 32px;border-bottom:1px solid var(--n300)}
  .ctl-label{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n600);margin-right:10px}
  .seg{display:inline-flex;border:1px solid var(--text)}
  .seg button{font-size:12.5px;font-weight:700;padding:6px 14px;border:none;border-left:1px solid var(--text);background:transparent;color:var(--text);cursor:pointer;text-align:left}
  .seg button:first-child{border-left:none}
  .seg button:hover{background:var(--n200)}
  .seg button.on,.seg button.on:hover{background:var(--accent);color:#fff}
  .note{font-size:12px;font-weight:500;color:var(--n700)}

  .datewrap{position:relative}
  .datebtn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:6px 14px;border:1px solid var(--text);background:transparent;color:var(--text);cursor:pointer}
  .datebtn:hover{background:var(--n200)}
  .datebtn.on,.datebtn.on:hover{background:var(--accent);color:#fff}
  .cal{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:280px;background:var(--bg);border:1px solid var(--text);box-shadow:var(--shadow-lg);padding:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head span{font-size:13px;font-weight:800}
  .cal-nav{width:26px;height:26px;border:none;background:transparent;font-size:15px;font-weight:800;cursor:pointer;color:var(--text)}
  .cal-nav:disabled{color:var(--n400);cursor:default}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-wd{font-size:10px;font-weight:800;text-align:center;padding:2px 0 6px;color:var(--n600)}
  .cal-d{display:flex;align-items:center;justify-content:center;height:31px;font-size:12px;font-weight:500;border:none;background:transparent;color:var(--text);cursor:default;padding:0}
  .cal-d.has{background:var(--n200);font-weight:600;cursor:pointer}
  .cal-d.has:hover{background:var(--n300)}
  .cal-d.in{background:var(--accent-100);color:var(--accent-700);font-weight:700}
  .cal-d.edge,.cal-d.pend{background:var(--accent);color:#fff;font-weight:800}
  .cal-hint{margin-top:11px;padding-top:10px;border-top:1px solid var(--n300);font-size:11.5px;line-height:1.5;color:var(--n700)}
  .cal-hint b{color:var(--accent-700)}

  .page{padding:0 32px}
  .inner{max-width:1360px;margin:0 auto}

  .heroRow{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border-bottom:1px solid var(--text)}
  .hero{background:var(--accent);color:#fff;padding:20px 24px;display:flex;flex-direction:column;justify-content:space-between;min-height:180px}
  .hero .lb{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
  .hero .val{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .hero .val b{font-size:clamp(38px,4.8vw,60px);font-weight:900;line-height:.95;letter-spacing:-.03em}
  .hero .val i{font-size:21px;font-weight:700;font-style:normal}
  .hero .meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;font-weight:600}
  .hero .delta{padding:1px 8px;background:#fff;color:var(--accent-700);font-weight:800}
  .kpis{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--text)}
  .kpi{padding:14px 18px;border-bottom:1px solid var(--n300);border-right:1px solid var(--n300);display:flex;flex-direction:column;gap:6px}
  .kpi .lb{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n700)}
  .kpi .v{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .kpi .n{font-size:11.5px;font-weight:500;color:var(--n700)}
  .kpi.warn{background:var(--accent-100)}
  .kpi.warn .v{color:var(--accent-700)}

  .sec{padding:18px 0 20px;border-bottom:1px solid var(--text)}
  .sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px}
  .sec-head h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .legend{display:flex;gap:18px;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--n700)}
  .sw-dot{width:9px;height:9px;background:var(--text)}
  .sw-line{width:16px;height:2px;background:var(--accent)}

  .chart{position:relative;height:150px;border-top:1px solid var(--n300);border-bottom:1px solid var(--text)}
  .chart svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .hits{position:absolute;inset:0;display:flex}
  .hits div{flex:1 1 0;min-width:0;height:100%;cursor:pointer}
  .vtx{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--text);cursor:pointer}
  .vtx.on{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--accent)}
  .axis{display:flex;justify-content:space-between;padding-top:8px;font-size:11px;font-weight:600;color:var(--n600)}
  .strip{margin-top:16px;border:1px solid var(--text);padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 30px}
  .strip .t{font-size:13px;font-weight:800;min-width:120px}
  .strip .st{display:flex;flex-direction:column;gap:3px}
  .strip .st b{font-size:16px;font-weight:800}
  .strip .st span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n600)}

  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 40px;border-bottom:1px solid var(--text)}
  .col{padding:18px 0 20px}
  .col h3{font-size:14px;font-weight:800;margin-bottom:3px}
  .col p{font-size:11.5px;font-weight:500;color:var(--n700);margin-bottom:12px}
  .brow{display:grid;grid-template-columns:112px minmax(0,1fr) 58px;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--n300)}
  .brow .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .track{display:block;height:12px;background:var(--n200)}
  .track i{display:block;height:12px;background:var(--text)}
  .col.vendor .track i{background:var(--accent)}
  .brow .ct{font-size:13px;font-weight:800;text-align:right}
  .prow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--n300)}
  .prow .rk{font-size:12px;font-weight:900;color:var(--n500)}
  .prow:first-of-type .rk{color:var(--accent)}
  .prow .pn{font-size:12.5px;font-weight:600;line-height:1.35;text-wrap:pretty}
  .prow .pq{text-align:right;white-space:nowrap}
  .prow .pq b{font-size:14px;font-weight:800}
  .prow .pq span{font-size:10.5px;font-weight:600;color:var(--n600)}

  .ledger{padding:18px 0 0}
  .lgrid{display:grid;grid-template-columns:132px 92px 92px minmax(0,1fr) minmax(0,1fr) 78px;gap:12px}
  .lhead{padding:9px 4px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--text);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n700)}
  .lscroll{border-top:1px solid var(--text);border-bottom:1px solid var(--text);max-height:380px;overflow-y:auto}
  .lrow{padding:5px 4px;border-bottom:1px solid var(--n300);font-size:13px}
  .lrow.on{background:var(--accent-100)}
  .lrow .cum{font-weight:800;color:var(--accent-700)}
  .ltot{padding:12px 4px;font-size:14px;font-weight:900;border-bottom:1px solid var(--text)}
  .ar{text-align:right}

  .report{padding:20px 0 0}
  .report h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .report>p{font-size:12.5px;font-weight:500;color:var(--n700);margin:5px 0 14px}
  .hl{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 14px;background:var(--n200);margin-bottom:14px}
  .hl span{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
  .hl i{width:13px;height:13px;display:block}
  .nblock{margin-top:14px}
  .nblock h3{font-size:12px;font-weight:800;color:var(--n700);margin-bottom:8px}
  .nlist{max-height:220px;overflow-y:auto;border:1px solid var(--n300)}
  .nitem{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;padding:8px 12px;font-size:12.5px;border-top:1px solid var(--n300)}
  .nitem:first-child{border-top:none}
  .nitem .w{font-weight:600}
  .nitem .x{color:var(--n700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nitem .f{color:var(--accent-700);font-weight:700;text-align:right}
  .none{font-size:12.5px;color:var(--n600);padding:10px 12px}

  .empty{border:1px dashed var(--n400);padding:56px 24px;font-size:14px;font-weight:700;color:var(--n600);margin:24px 0}
  [hidden]{display:none !important}
</style>

<div class="topbar">
  <div><span class="mark">Delivery Dashboard</span></div>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="sync" id="syncLabel"></span>
    <span id="reconChip"></span>
  </div>
</div>

<div class="controls">
  <div style="display:flex;align-items:center"><span class="ctl-label">브랜드</span><span class="seg" id="brandSeg"></span></div>
  <div style="display:flex;align-items:center"><span class="ctl-label">기간</span><span class="seg" id="rangeSeg"></span></div>
  <div class="datewrap" id="dateWrap">
    <button class="datebtn" id="dateBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="4" width="18" height="18"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      <span id="dateBtnLabel">날짜 선택</span>
    </button>
    <div class="cal" id="cal" hidden>
      <div class="cal-head"><button class="cal-nav" id="calPrev" type="button">‹</button><span id="calLabel"></span><button class="cal-nav" id="calNext" type="button">›</button></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-hint" id="calHint"></div>
    </div>
  </div>
  <span class="note" id="rangeNote"></span>
</div>

<div class="page"><div class="inner">
  <div class="empty" id="emptyState" hidden></div>

  <div id="body">
    <div class="heroRow">
      <div class="hero">
        <div class="lb" id="heroLabel"></div>
        <div>
          <div class="val num"><b id="heroValue">0</b><i id="heroUnit">원</i></div>
          <div class="meta"><span id="heroAvg"></span><span class="delta num" id="heroDelta"></span></div>
          <div class="meta" id="heroCaveat" hidden style="font-weight:500;opacity:.9"></div>
        </div>
      </div>
      <div class="kpis" id="kpis"></div>
    </div>

    <div class="sec" id="chartSec">
      <div class="sec-head">
        <h2>일별 배송 실적</h2>
        <div class="legend"><span><i class="sw-dot"></i>일별 매출</span><span><i class="sw-line"></i>누계</span></div>
      </div>
      <div class="chart" id="chart"></div>
      <div class="axis num"><span id="axisA"></span><span id="axisMid"></span><span id="axisB"></span></div>
      <div class="strip"><div class="t" id="stripTitle"></div><div id="stripStats" style="display:flex;flex-wrap:wrap;gap:12px 30px"></div></div>
    </div>

    <div class="cols">
      <div class="col"><h3>매출처별 배송</h3><p>고유 주문번호 기준 배송 건수</p><div id="marketBars"></div></div>
      <div class="col vendor"><h3>협력사별 배송</h3><p>분류 완료된 배송 건수 기준</p><div id="vendorBars"></div></div>
      <div class="col"><h3>TOP 5 판매 제품</h3><p>기간 합산 판매수량 기준</p><div id="top5"></div></div>
    </div>

    <div class="ledger">
      <div class="sec-head" style="margin-bottom:12px">
        <div><h2>일자별 누계 원장</h2><p class="note" style="margin-top:5px">최신 날짜부터 · 누계는 기간 시작일부터 해당 일자까지의 합계</p></div>
        <span style="font-size:11.5px;font-weight:700;color:var(--n700)">단위 원</span>
      </div>
      <div class="lscroll">
        <div class="lgrid lhead"><span>일자</span><span class="ar">배송 건수</span><span class="ar">주문 건수</span><span class="ar">일 매출</span><span class="ar">누계 매출</span><span class="ar">누계 비중</span></div>
        <div id="ledgerRows"></div>
      </div>
      <div class="lgrid ltot num" id="ledgerTotal"></div>
    </div>

    <div class="report" id="reportSection">
      <h2>작업 완료 리포트</h2>
      <p>원본 대조 결과 및 협력사 엑셀 강조 표시 안내</p>
      <div class="hl">
        <span><i style="background:#f9e48b"></i><span id="legendQty"></span></span>
        <span><i style="background:#bfe0f5"></i><span id="legendDup"></span></span>
        <span><i style="background:#f7c592"></i><span id="legendBoth"></span></span>
      </div>
      <div class="nblock"><h3 id="notesTitle">특이사항 (배송메시지)</h3><div class="nlist" id="notesList"></div></div>
      <div class="nblock"><h3 id="missingTitle">정보 누락 확인 필요</h3><div class="nlist" id="missingList"></div></div>
    </div>
  </div>
</div></div>

<script>
const embeddedSummary = __SUMMARY_JSON__;

const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); };
const nf = n => Math.round(n || 0).toLocaleString("ko-KR");
const DOW = ["일","월","화","수","목","금","토"];
const MSG_NO_DATA = "저장된 데이터가 없습니다. 주문서 xlsx를 업로드해 주세요.";
const MSG_LACK_DATA = "선택한 기간에 누적된 데이터가 없습니다.";

function parseDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function toKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fullDate(s){ const p = s.split("-"); return `${p[0]}. ${p[1]}. ${p[2]}`; }
function md(s){ const p = s.split("-"); return `${+p[1]}/${+p[2]}`; }

function sumInto(t, s){ for (const [k,v] of Object.entries(s||{})) t[k] = (t[k]||0) + v; }

function aggregate(docs){
  docs = docs.slice().sort((a,b) => a.run_date < b.run_date ? -1 : 1);
  const a = {
    dates: docs.map(d => d.run_date), orders:0, lines:0, revenue:0,
    markets:{}, vendors:{}, products:{}, unclassified:0, ambiguous:0,
    revenueMissing:0, highlight:{quantity:0,duplicate_address:0,both:0},
    notes:[], missing:[], allMatch:true, mismatched:[], series:[],
  };
  for (const d of docs){
    a.orders += d.total_order_count || 0;
    a.lines += d.total_line_count || 0;
    a.revenue += d.total_revenue || 0;
    a.unclassified += d.unclassified_count || 0;
    a.ambiguous += d.ambiguous_count || 0;
    a.revenueMissing += d.revenue_missing_count || 0;
    sumInto(a.markets, d.market_order_counts);
    sumInto(a.vendors, d.vendor_order_counts);
    sumInto(a.highlight, d.highlight_totals);
    (d.special_notes||[]).forEach(n => a.notes.push({...n, run_date:d.run_date}));
    (d.missing_info||[]).forEach(n => a.missing.push({...n, run_date:d.run_date}));
    if (d.reconciliation && d.reconciliation.match === false){ a.allMatch = false; a.mismatched.push(d.run_date); }
    for (const [n,v] of Object.entries(d.product_breakdown||{})){
      const p = a.products[n] || (a.products[n] = {quantity:0, revenue:0});
      p.quantity += v.quantity||0; p.revenue += v.revenue||0;
    }
    a.series.push({
      key: d.run_date, dow: parseDate(d.run_date).getDay(),
      revenue: d.total_revenue||0, orders: d.total_order_count||0, lines: d.total_line_count||0,
    });
  }
  a.top5 = Object.entries(a.products)
    .map(([name,v]) => ({name, quantity:v.quantity, revenue:v.revenue,
      share: a.revenue ? Math.round(v.revenue/a.revenue*1000)/10 : null}))
    .sort((x,y) => y.quantity - x.quantity).slice(0,5);
  return a;
}

function sliceForBrand(doc, brand){
  if (!brand || brand === "전체") return doc;
  const b = doc.by_brand && doc.by_brand[brand];
  if (!b) return null;
  return {
    run_date: doc.run_date,
    total_order_count: b.total_order_count, total_line_count: b.total_line_count,
    market_order_counts: b.market_order_counts, vendor_order_counts: b.vendor_order_counts,
    unclassified_count: b.unclassified_count, ambiguous_count: b.ambiguous_count,
    product_breakdown: b.product_breakdown, total_revenue: b.total_revenue,
    revenue_missing_count: b.revenue_missing_count,
    reconciliation: {match:true}, special_notes: [], missing_info: [],
    highlight_totals: {quantity:0, duplicate_address:0, both:0},
  };
}

// ---------------------------------------------------------------- rendering
let selectedDay = null;

function renderChart(a, cum){
  const box = $("chart");
  clear(box);
  const n = a.series.length;
  const maxRev = Math.max(...a.series.map(s => s.revenue), 1);
  const px = i => n > 1 ? (i/(n-1))*100 : 50;
  const py = (v,mx) => 94 - (mx ? (v/mx)*86 : 0);
  const daily = a.series.map((s,i) => `${px(i)},${py(s.revenue,maxRev)}`).join(" ");
  const cumPts = cum.map((c,i) => `${px(i)},${py(c, cum[n-1]||1)}`).join(" ");

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.setAttribute("preserveAspectRatio","none");
  const poly = (pts, tag, attrs) => {
    const e = document.createElementNS(NS, tag);
    e.setAttribute("points", pts);
    for (const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
    svg.appendChild(e);
  };
  poly(`0,100 ${daily} 100,100`, "polygon", {fill:"var(--n200)"});
  poly(daily, "polyline", {fill:"none", stroke:"var(--text)", "stroke-width":"2", "vector-effect":"non-scaling-stroke", "stroke-linejoin":"round", "stroke-linecap":"round"});
  poly(cumPts, "polyline", {fill:"none", stroke:"var(--accent)", "stroke-width":"2", "vector-effect":"non-scaling-stroke", "stroke-linejoin":"round"});
  box.appendChild(svg);

  const hits = el("div","hits");
  a.series.forEach(s => {
    const h = el("div");
    h.title = `${fullDate(s.key)} · ${nf(s.revenue)}원 · 배송 ${s.orders}건`;
    h.addEventListener("click", () => { selectedDay = selectedDay === s.key ? null : s.key; render(); });
    hits.appendChild(h);
  });
  box.appendChild(hits);

  if (n <= 32){
    a.series.forEach((s,i) => {
      const v = el("span", "vtx" + (selectedDay === s.key ? " on" : ""));
      v.style.left = px(i) + "%";
      v.style.top = py(s.revenue, maxRev) + "%";
      v.title = `${fullDate(s.key)} · ${nf(s.revenue)}원 · 배송 ${s.orders}건`;
      v.addEventListener("click", () => { selectedDay = selectedDay === s.key ? null : s.key; render(); });
      box.appendChild(v);
    });
  }
}

function renderBars(id, counts, cap){
  const c = $(id); clear(c);
  const e = Object.entries(counts||{}).sort((x,y) => y[1]-x[1]).slice(0, cap);
  if (!e.length){ c.appendChild(el("div","none","데이터 없음")); return; }
  const mx = Math.max(...e.map(x => x[1]), 1);
  e.forEach(([name,count]) => {
    const row = el("div","brow");
    row.appendChild(el("span","nm",name));
    const t = el("span","track"); const f = el("i");
    f.style.width = (count/mx*100) + "%"; t.appendChild(f); row.appendChild(t);
    row.appendChild(el("span","ct num", nf(count)));
    c.appendChild(row);
  });
}

function renderView(a, opts){
  const n = a.series.length;
  const total = a.revenue || 1;
  let run = 0;
  const cum = a.series.map(s => (run += s.revenue));
  if (selectedDay && !a.series.some(s => s.key === selectedDay)) selectedDay = null;

  $("heroLabel").textContent = `${opts.period} 누계 매출 · ${opts.brand}`;
  $("heroValue").textContent = nf(a.revenue);
  $("heroAvg").textContent = `일평균 ${nf(a.revenue/n)}원`;
  const dEl = $("heroDelta");
  if (opts.delta === null){ dEl.textContent = "직전 동기간 대비 기준 없음"; }
  else { dEl.textContent = `직전 동기간 대비 ${opts.delta >= 0 ? "+" : ""}${opts.delta.toFixed(1)}%`; }
  const cav = $("heroCaveat");
  cav.hidden = !a.revenueMissing;
  if (a.revenueMissing) cav.textContent = `※ 금액 정보가 없는 주문 ${a.revenueMissing}건은 제외된 금액입니다`;

  const needs = a.unclassified + a.ambiguous;
  const kpis = [
    ["총 배송 건수", nf(a.orders), `일평균 ${nf(a.orders/n)}건`, false],
    ["총 주문 건수", nf(a.lines), `배송 1건당 평균 ${(a.lines/(a.orders||1)).toFixed(2)}건`, false],
    ["배송 협력사", String(Object.keys(a.vendors).length), opts.brand === "전체" ? "전체 브랜드" : `${opts.brand} 단독`, false],
    ["확인 필요", nf(needs), `미분류 ${a.unclassified} · 중복매칭 ${a.ambiguous}`, needs > 0],
  ];
  const kb = $("kpis"); clear(kb);
  kpis.forEach(([lb,v,note,warn]) => {
    const c = el("div","kpi" + (warn ? " warn" : ""));
    c.appendChild(el("div","lb",lb));
    c.appendChild(el("div","v num",v));
    c.appendChild(el("div","n",note));
    kb.appendChild(c);
  });

  $("chartSec").hidden = n < 2;
  if (n > 1){
    renderChart(a, cum);
    $("axisA").textContent = md(a.series[0].key);
    $("axisMid").textContent = `누계 ${nf(a.revenue)}원`;
    $("axisB").textContent = md(a.series[n-1].key);

    const sel = selectedDay ? a.series.find(s => s.key === selectedDay) : null;
    const i = sel ? a.series.indexOf(sel) : -1;
    $("stripTitle").textContent = sel ? `${fullDate(sel.key)} (${DOW[sel.dow]})` : "기간 하이라이트";
    const stats = sel ? [
      ["일 매출", nf(sel.revenue)+"원"], ["배송", nf(sel.orders)+"건"], ["주문", nf(sel.lines)+"건"],
      ["해당일까지 누계", nf(cum[i])+"원"], ["누계 비중", (cum[i]/total*100).toFixed(1)+"%"],
    ] : [
      ["최고 매출일", md(a.series.reduce((x,y) => y.revenue > x.revenue ? y : x).key)],
      ["최저 매출일", md(a.series.reduce((x,y) => y.revenue < x.revenue ? y : x).key)],
      ["일평균 배송", nf(a.orders/n)+"건"], ["기간 일수", n+"일"],
    ];
    const sb = $("stripStats"); clear(sb);
    stats.forEach(([k,v]) => { const d = el("div","st"); d.appendChild(el("span",null,k)); d.appendChild(el("b","num",v)); sb.appendChild(d); });
  }

  renderBars("marketBars", a.markets, 7);
  renderBars("vendorBars", a.vendors, 7);

  const t5 = $("top5"); clear(t5);
  if (!a.top5.length) t5.appendChild(el("div","none","데이터 없음"));
  a.top5.forEach((p,i) => {
    const r = el("div","prow");
    r.appendChild(el("span","rk num",String(i+1)));
    r.appendChild(el("span","pn",p.name));
    r.appendChild(el("span","pq",`<b class="num">${nf(p.quantity)}</b><span> 개 · ${p.share != null ? p.share+"%" : "—"}</span>`));
    t5.appendChild(r);
  });

  const lr = $("ledgerRows"); clear(lr);
  a.series.map((s,i) => ({s, c:cum[i]})).reverse().forEach(({s,c}) => {
    const row = el("div","lgrid lrow num" + (selectedDay === s.key ? " on" : ""));
    const wk = s.dow === 0 || s.dow === 6;
    row.appendChild(el("span",null,`<b style="font-weight:700">${fullDate(s.key)}</b><span style="font-weight:500;color:${wk ? "var(--accent)" : "var(--n600)"}"> ${DOW[s.dow]}</span>`));
    row.appendChild(el("span","ar",nf(s.orders)));
    row.appendChild(el("span","ar",`<span style="color:var(--n700)">${nf(s.lines)}</span>`));
    row.appendChild(el("span","ar",`<b style="font-weight:700">${nf(s.revenue)}</b>`));
    row.appendChild(el("span","ar cum",nf(c)));
    row.appendChild(el("span","ar",`<span style="color:var(--n700)">${(c/total*100).toFixed(1)}%</span>`));
    lr.appendChild(row);
  });
  const lt = $("ledgerTotal"); clear(lt);
  [["합계",""],[nf(a.orders),"ar"],[nf(a.lines),"ar"],[nf(a.revenue),"ar"],[nf(a.revenue),"ar"],["100%","ar"]]
    .forEach(([v,c],i) => lt.appendChild(el("span", c + (i === 4 ? " " : ""), i === 4 ? `<span style="color:var(--accent)">${v}</span>` : v)));

  const chip = $("reconChip"); clear(chip);
  chip.appendChild(a.allMatch
    ? el("span","chip ok","원본 대조 완료 · 누락 없음")
    : el("span","chip bad",`대조 불일치 (${a.mismatched.join(", ")})`));

  const rep = $("reportSection");
  rep.hidden = n > 1;
  if (n > 1) return;
  const h = a.highlight || {};
  $("legendQty").textContent = `수량 2개 이상: ${h.quantity||0}건`;
  $("legendDup").textContent = `동일 수령인·주소 중복: ${h.duplicate_address||0}건`;
  $("legendBoth").textContent = `둘 다 해당: ${h.both||0}건`;
  const fill = (listId, titleId, title, items, rowFn) => {
    const c = $(listId); clear(c);
    $(titleId).textContent = `${title} (${items.length}건)`;
    if (!items.length){ c.appendChild(el("div","none","해당 없음")); return; }
    items.forEach(it => c.appendChild(rowFn(it)));
  };
  fill("notesList","notesTitle","특이사항 (배송메시지)", a.notes, n2 => {
    const r = el("div","nitem");
    r.appendChild(el("span","w", n2.receiver_name || "-"));
    r.appendChild(el("span","x", `${n2.product_name||""} · ${n2.message||""}`));
    r.appendChild(el("span","f", n2.order_id || ""));
    return r;
  });
  fill("missingList","missingTitle","정보 누락 확인 필요", a.missing, n2 => {
    const r = el("div","nitem");
    r.appendChild(el("span","w", n2.receiver_name || "(수령인명 없음)"));
    r.appendChild(el("span","x", n2.product_name || ""));
    r.appendChild(el("span","f", (n2.missing_fields||[]).join(", ") + " 없음"));
    return r;
  });
}

// ---------------------------------------------------------------- state
let allDocs = [embeddedSummary];
let dbAvailable = false;
let dates = [], latestDate = null, availableDates = new Set();
let brand = "전체", range = "week", custom = null;
let calY = 2026, calM = 0, pending = null;

function docsForRange(){
  if (custom) return allDocs.filter(d => d.run_date >= custom.start && d.run_date <= custom.end);
  if (range === "today") return allDocs.filter(d => d.run_date === toKey(latestDate));
  if (range === "week"){
    const s = toKey(addDays(latestDate,-6));
    return allDocs.filter(d => d.run_date >= s && d.run_date <= toKey(latestDate));
  }
  if (range === "month") return allDocs.filter(d => { const x = parseDate(d.run_date); return x.getFullYear() === latestDate.getFullYear() && x.getMonth() === latestDate.getMonth(); });
  return allDocs.filter(d => { const x = parseDate(d.run_date); return x.getFullYear() === latestDate.getFullYear() && Math.floor(x.getMonth()/3) === Math.floor(latestDate.getMonth()/3); });
}

function prevDocs(cur){
  if (!cur.length) return [];
  const sorted = allDocs.slice().sort((a,b) => a.run_date < b.run_date ? -1 : 1);
  const i = sorted.findIndex(d => d.run_date === cur[0].run_date);
  return sorted.slice(Math.max(0, i - cur.length), i);
}

function showEmpty(msg){
  $("emptyState").hidden = false;
  $("emptyState").textContent = msg;
  $("body").hidden = true;
  clear($("reconChip"));
}

const RANGE_LABELS = {today:"오늘", week:"최근 7일", month:"이번 달", quarter:"이번 분기"};

function render(){
  // 세그먼트 활성 상태
  [...$("brandSeg").children].forEach(b => b.classList.toggle("on", b.dataset.v === brand));
  [...$("rangeSeg").children].forEach(b => b.classList.toggle("on", !custom && b.dataset.v === range));
  $("dateBtn").classList.toggle("on", !!custom);
  $("dateBtnLabel").textContent = custom
    ? (custom.start === custom.end ? fullDate(custom.start) : `${md(custom.start)} — ${md(custom.end)}`)
    : "날짜 선택";

  if (!allDocs.some(d => (d.total_order_count||0) > 0)) return showEmpty(MSG_NO_DATA);
  const raw = docsForRange().map(d => sliceForBrand(d, brand)).filter(Boolean);
  if (!raw.length) return showEmpty(MSG_LACK_DATA);

  $("emptyState").hidden = true;
  $("body").hidden = false;

  const a = aggregate(raw);
  const p = aggregate(prevDocs(raw).map(d => sliceForBrand(d, brand)).filter(Boolean));
  const delta = p.revenue ? (a.revenue - p.revenue) / p.revenue * 100 : null;
  const n = a.series.length;

  $("rangeNote").textContent = n > 1
    ? `${fullDate(a.series[0].key)} — ${fullDate(a.series[n-1].key)} · ${n}일치 누계`
    : `${fullDate(a.series[0].key)} · 1일치`;
  $("syncLabel").textContent = `Last sync ${allDocs[allDocs.length-1].run_date}`;

  renderView(a, {brand, period: custom ? "선택 기간" : RANGE_LABELS[range], delta});
}

// ---------------------------------------------------------------- calendar
function renderCalendar(){
  $("calLabel").textContent = `${calY}년 ${calM+1}월`;
  const minD = parseDate(dates[0]), maxD = parseDate(dates[dates.length-1]);
  $("calPrev").disabled = calY === minD.getFullYear() && calM === minD.getMonth();
  $("calNext").disabled = calY === maxD.getFullYear() && calM === maxD.getMonth();
  const g = $("calGrid"); clear(g);
  DOW.forEach(w => g.appendChild(el("div","cal-wd",w)));
  const lead = new Date(calY, calM, 1).getDay();
  const dim = new Date(calY, calM+1, 0).getDate();
  for (let i = 0; i < lead; i++) g.appendChild(el("div","cal-d"));
  for (let d = 1; d <= dim; d++){
    const key = toKey(new Date(calY, calM, d));
    const has = availableDates.has(key);
    const cls = ["cal-d"];
    if (has) cls.push("has");
    if (custom && key >= custom.start && key <= custom.end) cls.push("in");
    if (custom && (key === custom.start || key === custom.end)) cls.push("edge");
    if (pending === key) cls.push("pend");
    const cell = el("button", cls.join(" "), String(d));
    cell.type = "button";
    if (has) cell.addEventListener("click", e => {
      e.stopPropagation();
      if (!pending){ pending = key; renderCalendar(); return; }
      const start = pending <= key ? pending : key, end = pending <= key ? key : pending;
      pending = null; custom = {start, end}; selectedDay = null;
      $("cal").hidden = true;
      renderCalendar(); render();
    });
    else cell.disabled = true;
    g.appendChild(cell);
  }
  $("calHint").innerHTML = pending
    ? `시작일 <b>${fullDate(pending)}</b> 선택됨 · 종료일을 클릭하세요<br>(같은 날짜를 다시 누르면 하루만 조회)`
    : "시작일과 종료일을 차례로 클릭하면 그 구간의 누계를 봅니다.";
}

// ---------------------------------------------------------------- init
async function init(){
  try {
    const db = await claude.use("db");
    if (db){
      const snap = await db.collection("daily_summaries").orderBy("run_date","asc").limit(400).get();
      const docs = snap.docs.map(d => d.data()).filter(Boolean);
      if (docs.length){ allDocs = docs; dbAvailable = true; }
    }
  } catch (e) { /* db 사용 불가 → 오늘 데이터만 */ }

  allDocs.sort((a,b) => a.run_date < b.run_date ? -1 : 1);
  dates = [...new Set(allDocs.map(d => d.run_date))].sort();
  availableDates = new Set(dates);
  latestDate = parseDate(dates[dates.length-1]);
  calY = latestDate.getFullYear(); calM = latestDate.getMonth();
  if (!dbAvailable || dates.length < 2) range = "today";

  const bs = $("brandSeg");
  ["전체","JM","MSNA"].forEach(v => {
    const b = el("button",null,v); b.type = "button"; b.dataset.v = v;
    b.addEventListener("click", () => { brand = v; selectedDay = null; render(); });
    bs.appendChild(b);
  });
  const rs = $("rangeSeg");
  Object.entries(RANGE_LABELS).forEach(([v,l]) => {
    const b = el("button",null,l); b.type = "button"; b.dataset.v = v;
    b.addEventListener("click", () => { range = v; custom = null; pending = null; selectedDay = null; $("cal").hidden = true; renderCalendar(); render(); });
    rs.appendChild(b);
  });

  $("calPrev").addEventListener("click", () => { calM--; if (calM < 0){ calM = 11; calY--; } renderCalendar(); });
  $("calNext").addEventListener("click", () => { calM++; if (calM > 11){ calM = 0; calY++; } renderCalendar(); });
  $("dateBtn").addEventListener("click", e => {
    e.stopPropagation();
    const c = $("cal");
    c.hidden = !c.hidden;
    pending = null;
    if (!c.hidden) renderCalendar();
  });
  document.addEventListener("click", e => {
    if (!$("dateWrap").contains(e.target) && !$("cal").hidden){ $("cal").hidden = true; pending = null; }
  });

  $("dateWrap").hidden = dates.length < 2;
  renderCalendar();
  render();
}

init();
</script>
