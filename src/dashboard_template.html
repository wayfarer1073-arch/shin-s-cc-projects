<title>주문 처리 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --surface-2:   #f3f2ee;
    --text-1:      #0b0b0b;
    --text-2:      #52514e;
    --text-muted:  #898781;
    --grid:        #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --accent-soft: #cde2fb;
    --series-2:    #eb6834;
    --series-2-soft: #fbdccb;
    --series-3:    #1baf7a;
    --warn:        #fab219;
    --warn-text:   #7a5200;
    --warn-soft:   #fdecc4;
    --good:        #0ca30c;
    --good-soft:   #e2f6e2;
    --critical:    #d03b3b;
    --critical-soft: #fbe3e2;
    --hl-qty:      #f9e48b;
    --hl-dup:      #bfe0f5;
    --hl-both:     #f7c592;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --surface-2:   #232322;
      --text-1:      #ffffff;
      --text-2:      #c3c2b7;
      --text-muted:  #898781;
      --grid:        #2c2c2a;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --accent-soft: #184f95;
      --series-2:    #d95926;
      --series-2-soft: #5c2a10;
      --series-3:    #199e70;
      --warn:        #fab219;
      --warn-text:   #ffd77a;
      --warn-soft:   #3a2d08;
      --good:        #0ca30c;
      --good-soft:   #123018;
      --critical:    #e66767;
      --critical-soft: #3a1414;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #232322;
    --text-1:      #ffffff;
    --text-2:      #c3c2b7;
    --text-muted:  #898781;
    --grid:        #2c2c2a;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --accent-soft: #184f95;
    --series-2:    #d95926;
    --series-2-soft: #5c2a10;
    --series-3:    #199e70;
    --warn:        #fab219;
    --warn-text:   #ffd77a;
    --warn-soft:   #3a2d08;
    --good:        #0ca30c;
    --good-soft:   #123018;
    --critical:    #e66767;
    --critical-soft: #3a1414;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--page);
    color: var(--text-1);
    font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 20px 56px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .run-date {
    font-size: 13px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .hero-revenue {
    background: linear-gradient(135deg, var(--accent) 0%, var(--series-3) 130%);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 12px;
    color: #ffffff;
  }
  .hero-revenue .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.88;
    margin-bottom: 8px;
  }
  .hero-revenue .value {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .hero-revenue .value .unit { font-size: 20px; font-weight: 600; margin-left: 4px; }
  .hero-revenue .caveat {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.85;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label {
    font-size: 11.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .tile .value {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .tile .value.warn { color: var(--warn-text); }
  .tile.chip-warn {
    background: var(--warn-soft);
    border-color: transparent;
  }
  .tile.chip-warn .label { color: var(--warn-text); opacity: 0.85; }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  @media (max-width: 620px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
  }
  .panel h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .panel .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 84px 1fr 34px;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-top: 1px solid var(--grid);
  }
  .bar-row:first-of-type { border-top: none; }
  .bar-row .name {
    font-size: 12.5px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    position: relative;
    height: 16px;
    background: var(--surface-2);
    border-radius: 8px;
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 8px;
    background: var(--accent);
  }
  .panel.vendor .bar-fill { background: var(--series-2); }
  .bar-row .count {
    font-size: 13px;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .leaderboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
  }
  .leaderboard h2 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  .leaderboard .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .lb-row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--grid);
  }
  .lb-row:first-of-type { border-top: none; }
  .lb-rank {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .lb-row:nth-of-type(1) .lb-rank { color: var(--accent); }
  .lb-main .lb-name {
    font-size: 13.5px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .lb-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 4px;
    overflow: hidden;
  }
  .lb-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--series-3);
  }
  .lb-qty-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .lb-qty {
    font-size: 14px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .lb-qty .unit { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-left: 2px; }
  .lb-share {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .lb-share.muted { color: var(--text-muted); background: var(--surface-2); font-weight: 500; }

  .empty-note {
    font-size: 12.5px;
    color: var(--text-muted);
    padding: 10px 0;
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
  }
  .status-chip.good { color: var(--good); background: var(--good-soft); }
  .status-chip.critical { color: var(--critical); background: var(--critical-soft); }
  .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .report {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
    margin-bottom: 14px;
  }
  .report h2 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  .report .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }

  .legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text-2);
  }
  .legend-swatch { width: 13px; height: 13px; border-radius: 3px; flex: none; }

  .note-block { margin-top: 14px; }
  .note-block:first-child { margin-top: 0; }
  .note-block h3 {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    margin: 0 0 8px;
  }
  .note-list {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--grid);
    border-radius: 8px;
  }
  .note-item {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 10px;
    padding: 9px 12px;
    font-size: 12.5px;
    border-top: 1px solid var(--grid);
  }
  .note-item:first-child { border-top: none; }
  .note-item .n-who { color: var(--text-1); font-weight: 500; }
  .note-item .n-what { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-item .n-flag { color: var(--critical); font-weight: 600; text-align: right; }
</style>

<div class="wrap">
  <header class="top">
    <h1>주문 처리 대시보드</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="run-date" id="runDate"></div>
      <div id="reconChip"></div>
    </div>
  </header>

  <div class="hero-revenue" id="heroRevenue"></div>

  <div class="tiles" id="tiles"></div>

  <div class="panels">
    <section class="panel market">
      <h2>오픈마켓별 주문 건수</h2>
      <p class="sub">고유 주문번호 기준</p>
      <div id="marketBars"></div>
    </section>
    <section class="panel vendor">
      <h2>협력사별 주문 건수</h2>
      <p class="sub">분류 완료된 주문 기준</p>
      <div id="vendorBars"></div>
    </section>
  </div>

  <section class="leaderboard">
    <h2>TOP 5 판매 제품</h2>
    <p class="sub">전체 마켓 합산 판매수량 기준</p>
    <div id="top5"></div>
  </section>

  <section class="report">
    <h2>작업 완료 리포트</h2>
    <p class="sub">원본 대조 결과 및 협력사 엑셀 강조 표시 안내</p>

    <div class="legend-row">
      <div class="legend-item"><span class="legend-swatch" style="background:var(--hl-qty)"></span><span id="legendQty"></span></div>
      <div class="legend-item"><span class="legend-swatch" style="background:var(--hl-dup)"></span><span id="legendDup"></span></div>
      <div class="legend-item"><span class="legend-swatch" style="background:var(--hl-both)"></span><span id="legendBoth"></span></div>
    </div>

    <div class="note-block">
      <h3 id="notesTitle">특이사항 (배송메시지)</h3>
      <div class="note-list" id="notesList"></div>
    </div>
    <div class="note-block">
      <h3 id="missingTitle">정보 누락 확인 필요</h3>
      <div class="note-list" id="missingList"></div>
    </div>
  </section>
</div>

<script>
  const data = __SUMMARY_JSON__;

  function fmtDate(s) {
    if (!s) return "";
    const [y, m, d] = s.split("-");
    return `${y}년 ${parseInt(m,10)}월 ${parseInt(d,10)}일 처리 결과`;
  }
  document.getElementById("runDate").textContent = fmtDate(data.run_date);

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  // --- 총 매출액 ---
  const hero = document.getElementById("heroRevenue");
  const revenue = data.total_revenue || 0;
  const revenueStr = revenue.toLocaleString("ko-KR");
  hero.appendChild(el("div", "label", "총 매출액"));
  hero.appendChild(el("div", "value", `${revenueStr}<span class="unit">원</span>`));
  if (data.revenue_missing_count > 0) {
    hero.appendChild(el(
      "div", "caveat",
      `※ 금액 정보가 없는 주문 ${data.revenue_missing_count}건은 제외된 금액입니다`
    ));
  }

  // --- 상단 통계 타일 ---
  const tiles = document.getElementById("tiles");
  const vendorCount = Object.keys(data.vendor_order_counts || {}).length;
  const needsReview = (data.unclassified_count || 0) + (data.ambiguous_count || 0);

  const tileDefs = [
    ["전체 주문", data.total_order_count, false],
    ["처리 라인 수", data.total_line_count, false],
    ["분류된 협력사", vendorCount, false],
    ["확인 필요", needsReview, true],
  ];
  tileDefs.forEach(([label, value, isWarn]) => {
    const t = el("div", "tile" + (isWarn && value > 0 ? " chip-warn" : ""));
    t.appendChild(el("div", "label", label));
    t.appendChild(el("div", "value" + (isWarn && value > 0 ? " warn" : ""), String(value)));
    tiles.appendChild(t);
  });

  // --- 바 차트 공통 렌더러 ---
  function renderBars(containerId, counts) {
    const container = document.getElementById(containerId);
    const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
    if (entries.length === 0) {
      container.appendChild(el("div", "empty-note", "데이터 없음"));
      return;
    }
    const max = Math.max(...entries.map(([, v]) => v));
    entries.forEach(([name, count]) => {
      const row = el("div", "bar-row");
      row.appendChild(el("div", "name", name));
      const track = el("div", "bar-track");
      const fill = el("div", "bar-fill");
      fill.style.width = (max ? (count / max) * 100 : 0) + "%";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div", "count", String(count)));
      container.appendChild(row);
    });
  }
  renderBars("marketBars", data.market_order_counts);
  renderBars("vendorBars", data.vendor_order_counts);

  // --- TOP5 리더보드 ---
  const top5El = document.getElementById("top5");
  const top5 = data.top5_products || [];
  if (top5.length === 0) {
    top5El.appendChild(el("div", "empty-note", "데이터 없음"));
  } else {
    const maxQty = Math.max(...top5.map(p => p.quantity));
    top5.forEach((p, i) => {
      const row = el("div", "lb-row");
      row.appendChild(el("div", "lb-rank", String(i + 1)));
      const main = el("div", "lb-main");
      main.appendChild(el("div", "lb-name", p.product_name));
      const track = el("div", "lb-track");
      const fill = el("div", "lb-fill");
      fill.style.width = (maxQty ? (p.quantity / maxQty) * 100 : 0) + "%";
      track.appendChild(fill);
      main.appendChild(track);
      row.appendChild(main);

      const qtyWrap = el("div", "lb-qty-wrap");
      qtyWrap.appendChild(el("div", "lb-qty", `${p.quantity}<span class="unit">개</span>`));
      const shareText = p.revenue_share_pct != null ? `매출 ${p.revenue_share_pct}%` : "매출 정보 없음";
      qtyWrap.appendChild(el("div", "lb-share" + (p.revenue_share_pct == null ? " muted" : ""), shareText));
      row.appendChild(qtyWrap);

      top5El.appendChild(row);
    });
  }

  // --- 대조 결과 칩 ---
  const recon = data.reconciliation || {};
  const reconChip = document.getElementById("reconChip");
  if (recon.match) {
    reconChip.appendChild(el(
      "span", "status-chip good",
      `<span class="dot"></span>원본 ${recon.raw_count}건 대조 완료 · 누락 없음`
    ));
  } else if (recon.raw_count != null) {
    reconChip.appendChild(el(
      "span", "status-chip critical",
      `<span class="dot"></span>원본 ${recon.raw_count}건 vs 처리 ${recon.processed_count}건 불일치`
    ));
  }

  // --- 강조 표시 범례 ---
  const ht = data.highlight_totals || {};
  document.getElementById("legendQty").textContent = `수량 2개 이상: ${ht.quantity || 0}건`;
  document.getElementById("legendDup").textContent = `동일 수령인·주소 중복: ${ht.duplicate_address || 0}건`;
  document.getElementById("legendBoth").textContent = `둘 다 해당: ${ht.both || 0}건`;

  // --- 특이사항 / 정보 누락 리스트 ---
  function renderNoteList(containerId, titleId, titleLabel, items, rowRenderer) {
    const container = document.getElementById(containerId);
    document.getElementById(titleId).textContent = `${titleLabel} (${items.length}건)`;
    if (items.length === 0) {
      container.appendChild(el("div", "empty-note", "해당 없음"));
      return;
    }
    items.forEach(item => container.appendChild(rowRenderer(item)));
  }

  renderNoteList("notesList", "notesTitle", "특이사항 (배송메시지)", data.special_notes || [], (n) => {
    const row = el("div", "note-item");
    row.appendChild(el("div", "n-who", n.receiver_name || "-"));
    row.appendChild(el("div", "n-what", `${n.product_name || ""} · ${n.message}`));
    row.appendChild(el("div", "n-flag", n.order_id || ""));
    return row;
  });

  renderNoteList("missingList", "missingTitle", "정보 누락 확인 필요", data.missing_info || [], (n) => {
    const row = el("div", "note-item");
    row.appendChild(el("div", "n-who", n.receiver_name || "(수령인명 없음)"));
    row.appendChild(el("div", "n-what", n.product_name || ""));
    row.appendChild(el("div", "n-flag", (n.missing_fields || []).join(", ") + " 없음"));
    return row;
  });
</script>
