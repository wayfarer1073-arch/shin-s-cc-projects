<title>주문 처리 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --surface-2:   #f3f2ee;
    --text-1:      #0b0b0b;
    --text-2:      #52514e;
    --text-muted:  #898781;
    --grid:        #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --accent-soft: #cde2fb;
    --series-2:    #eb6834;
    --series-2-soft: #fbdccb;
    --series-3:    #1baf7a;
    --warn:        #fab219;
    --warn-text:   #7a5200;
    --warn-soft:   #fdecc4;
    --good:        #0ca30c;
    --good-soft:   #e2f6e2;
    --critical:    #d03b3b;
    --critical-soft: #fbe3e2;
    --hl-qty:      #f9e48b;
    --hl-dup:      #bfe0f5;
    --hl-both:     #f7c592;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --surface-2:   #232322;
      --text-1:      #ffffff;
      --text-2:      #c3c2b7;
      --text-muted:  #898781;
      --grid:        #2c2c2a;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --accent-soft: #184f95;
      --series-2:    #d95926;
      --series-2-soft: #5c2a10;
      --series-3:    #199e70;
      --warn:        #fab219;
      --warn-text:   #ffd77a;
      --warn-soft:   #3a2d08;
      --good:        #0ca30c;
      --good-soft:   #123018;
      --critical:    #e66767;
      --critical-soft: #3a1414;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #232322;
    --text-1:      #ffffff;
    --text-2:      #c3c2b7;
    --text-muted:  #898781;
    --grid:        #2c2c2a;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --accent-soft: #184f95;
    --series-2:    #d95926;
    --series-2-soft: #5c2a10;
    --series-3:    #199e70;
    --warn:        #fab219;
    --warn-text:   #ffd77a;
    --warn-soft:   #3a2d08;
    --good:        #0ca30c;
    --good-soft:   #123018;
    --critical:    #e66767;
    --critical-soft: #3a1414;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--page);
    color: var(--text-1);
    font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 20px 56px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .run-date {
    font-size: 13px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* --- 기간 선택 --- */
  .range-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .range-btn {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .range-btn:hover { background: var(--surface-2); }
  .range-btn.active {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }
  .range-note {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* --- 날짜 선택 캘린더 --- */
  .date-picker { position: relative; }
  .date-btn {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .date-btn:hover { background: var(--surface-2); }
  .date-btn.active {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }
  .calendar-pop {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    padding: 12px;
    width: 248px;
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .cal-header .cal-label {
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .cal-nav {
    font: inherit;
    width: 24px;
    height: 24px;
    border: none;
    background: none;
    color: var(--text-2);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .cal-nav:hover { background: var(--surface-2); }
  .cal-nav:disabled { color: var(--grid); cursor: default; }
  .cal-nav:disabled:hover { background: none; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-weekday {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-align: center;
    padding: 4px 0 6px;
  }
  .cal-day {
    font: inherit;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    border-radius: 7px;
    color: var(--text-1);
    cursor: pointer;
  }
  .cal-day.has-data { background: var(--accent-soft); font-weight: 600; }
  .cal-day.has-data:hover { background: var(--accent); color: #ffffff; }
  .cal-day.in-range { background: var(--accent-soft); border-radius: 0; font-weight: 600; }
  .cal-day.range-edge, .cal-day.selected {
    background: var(--accent);
    color: #ffffff;
    font-weight: 700;
    border-radius: 7px;
  }
  .cal-day.pending-start {
    background: var(--accent);
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .cal-day.empty-day, .cal-day.no-data {
    color: var(--text-muted);
    cursor: default;
    opacity: 0.45;
  }
  .cal-hint {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--grid);
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .cal-hint b { color: var(--accent); font-weight: 700; }

  .hero-revenue {
    background: linear-gradient(135deg, var(--accent) 0%, var(--series-3) 130%);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 12px;
    color: #ffffff;
  }
  .hero-revenue .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.88;
    margin-bottom: 8px;
  }
  .hero-revenue .value {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .hero-revenue .value .unit { font-size: 20px; font-weight: 600; margin-left: 4px; }
  .hero-revenue .caveat, .hero-revenue .avg {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.85;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label {
    font-size: 11.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .tile .value {
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .tile .value.warn { color: var(--warn-text); }
  .tile.chip-warn {
    background: var(--warn-soft);
    border-color: transparent;
  }
  .tile.chip-warn .label { color: var(--warn-text); opacity: 0.85; }

  /* --- 추이 차트 --- */
  .trend-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
    margin-bottom: 14px;
  }
  .trend-panel h2 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  .trend-panel .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }
  .trend-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 120px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .trend-bar-wrap {
    flex: 1 0 6px;
    min-width: 6px;
    max-width: 28px;
    height: 100%;
    display: flex;
    align-items: flex-end;
    cursor: pointer;
  }
  .trend-bar {
    width: 100%;
    min-height: 2px;
    border-radius: 3px 3px 0 0;
    background: var(--accent);
  }
  .trend-bar-wrap:hover .trend-bar { background: var(--series-2); }
  .trend-axis {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--text-1);
    color: var(--page);
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 10;
    display: none;
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  @media (max-width: 620px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
  }
  .panel h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .panel .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 84px 1fr 34px;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-top: 1px solid var(--grid);
  }
  .bar-row:first-of-type { border-top: none; }
  .bar-row .name {
    font-size: 12.5px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    position: relative;
    height: 16px;
    background: var(--surface-2);
    border-radius: 8px;
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 8px;
    background: var(--accent);
  }
  .panel.vendor .bar-fill { background: var(--series-2); }
  .bar-row .count {
    font-size: 13px;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .leaderboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
  }
  .leaderboard h2 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  .leaderboard .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .lb-row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--grid);
  }
  .lb-row:first-of-type { border-top: none; }
  .lb-rank {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .lb-row:nth-of-type(1) .lb-rank { color: var(--accent); }
  .lb-main .lb-name {
    font-size: 13.5px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .lb-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 4px;
    overflow: hidden;
  }
  .lb-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--series-3);
  }
  .lb-qty-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .lb-qty {
    font-size: 14px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .lb-qty .unit { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-left: 2px; }
  .lb-share {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .lb-share.muted { color: var(--text-muted); background: var(--surface-2); font-weight: 500; }

  .empty-note {
    font-size: 12.5px;
    color: var(--text-muted);
    padding: 10px 0;
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
  }
  .status-chip.good { color: var(--good); background: var(--good-soft); }
  .status-chip.critical { color: var(--critical); background: var(--critical-soft); }
  .status-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .report {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;
    margin-bottom: 14px;
  }
  .report h2 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  .report .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }

  .legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--text-2);
  }
  .legend-swatch { width: 13px; height: 13px; border-radius: 3px; flex: none; }

  .note-block { margin-top: 14px; }
  .note-block:first-child { margin-top: 0; }
  .note-block h3 {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    margin: 0 0 8px;
  }
  .note-list {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--grid);
    border-radius: 8px;
  }
  .note-item {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 10px;
    padding: 9px 12px;
    font-size: 12.5px;
    border-top: 1px solid var(--grid);
  }
  .note-item:first-child { border-top: none; }
  .note-item .n-who { color: var(--text-1); font-weight: 500; }
  .note-item .n-what { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-item .n-flag { color: var(--critical); font-weight: 600; text-align: right; }
</style>

<div class="wrap">
  <header class="top">
    <h1>주문 처리 대시보드</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="run-date" id="runDate"></div>
      <div id="reconChip"></div>
    </div>
  </header>

  <div class="range-bar" id="rangeBar" hidden>
    <button class="range-btn" data-range="today">오늘</button>
    <button class="range-btn" data-range="week">최근 7일</button>
    <button class="range-btn" data-range="month">이번 달</button>
    <button class="range-btn" data-range="quarter">이번 분기</button>
    <div class="date-picker" id="datePicker">
      <button class="date-btn" id="dateBtn">📅 날짜 선택</button>
      <div class="calendar-pop" id="calendarPop" hidden>
        <div class="cal-header">
          <button class="cal-nav" id="calPrev" type="button">‹</button>
          <span class="cal-label" id="calLabel"></span>
          <button class="cal-nav" id="calNext" type="button">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-hint" id="calHint" hidden></div>
      </div>
    </div>
    <span class="range-note" id="rangeNote"></span>
  </div>

  <div class="hero-revenue" id="heroRevenue"></div>

  <div class="tiles" id="tiles"></div>

  <div class="trend-panel" id="trendPanel" hidden>
    <h2>일별 매출 추이</h2>
    <p class="sub" id="trendSub"></p>
    <div class="trend-chart" id="trendChart"></div>
    <div class="trend-axis" id="trendAxis"></div>
  </div>

  <div class="panels">
    <section class="panel market">
      <h2>오픈마켓별 주문 건수</h2>
      <p class="sub">고유 주문번호 기준</p>
      <div id="marketBars"></div>
    </section>
    <section class="panel vendor">
      <h2>협력사별 주문 건수</h2>
      <p class="sub">분류 완료된 주문 기준</p>
      <div id="vendorBars"></div>
    </section>
  </div>

  <section class="leaderboard">
    <h2>TOP 5 판매 제품</h2>
    <p class="sub" id="top5Sub">전체 마켓 합산 판매수량 기준</p>
    <div id="top5"></div>
  </section>

  <section class="report" id="reportSection">
    <h2>작업 완료 리포트</h2>
    <p class="sub">원본 대조 결과 및 협력사 엑셀 강조 표시 안내</p>

    <div class="legend-row">
      <div class="legend-item"><span class="legend-swatch" style="background:var(--hl-qty)"></span><span id="legendQty"></span></div>
      <div class="legend-item"><span class="legend-swatch" style="background:var(--hl-dup)"></span><span id="legendDup"></span></div>
      <div class="legend-item"><span class="legend-swatch" style="background:var(--hl-both)"></span><span id="legendBoth"></span></div>
    </div>

    <div class="note-block">
      <h3 id="notesTitle">특이사항 (배송메시지)</h3>
      <div class="note-list" id="notesList"></div>
    </div>
    <div class="note-block">
      <h3 id="missingTitle">정보 누락 확인 필요</h3>
      <div class="note-list" id="missingList"></div>
    </div>
  </section>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
  const embeddedSummary = __SUMMARY_JSON__;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function fmtDateLabel(s) {
    if (!s) return "";
    const [y, m, d] = s.split("-");
    return `${y}년 ${parseInt(m,10)}월 ${parseInt(d,10)}일`;
  }
  function fmtShortDate(s) {
    const [, m, d] = s.split("-");
    return `${parseInt(m,10)}/${parseInt(d,10)}`;
  }

  // ---------------------------------------------------------------------
  // 여러 날짜의 summary 문서를 하나로 합산한다 (기간별 지표 계산용).
  // ---------------------------------------------------------------------
  function sumCounts(target, src) {
    for (const [k, v] of Object.entries(src || {})) target[k] = (target[k] || 0) + v;
  }

  function aggregate(docs) {
    docs = docs.slice().sort((a, b) => a.run_date < b.run_date ? -1 : 1);
    const agg = {
      dates: docs.map(d => d.run_date),
      total_order_count: 0,
      total_line_count: 0,
      market_order_counts: {},
      vendor_order_counts: {},
      unclassified_count: 0,
      ambiguous_count: 0,
      total_revenue: 0,
      revenue_missing_count: 0,
      highlight_totals: { quantity: 0, duplicate_address: 0, both: 0 },
      special_notes: [],
      missing_info: [],
      reconciliation_all_match: true,
      mismatched_dates: [],
      product_breakdown: {},
      daily_revenue: [],
    };
    for (const d of docs) {
      agg.total_order_count += d.total_order_count || 0;
      agg.total_line_count += d.total_line_count || 0;
      agg.unclassified_count += d.unclassified_count || 0;
      agg.ambiguous_count += d.ambiguous_count || 0;
      agg.total_revenue += d.total_revenue || 0;
      agg.revenue_missing_count += d.revenue_missing_count || 0;
      sumCounts(agg.market_order_counts, d.market_order_counts);
      sumCounts(agg.vendor_order_counts, d.vendor_order_counts);
      sumCounts(agg.highlight_totals, d.highlight_totals);
      (d.special_notes || []).forEach(n => agg.special_notes.push({ ...n, run_date: d.run_date }));
      (d.missing_info || []).forEach(n => agg.missing_info.push({ ...n, run_date: d.run_date }));
      if (d.reconciliation && d.reconciliation.match === false) {
        agg.reconciliation_all_match = false;
        agg.mismatched_dates.push(d.run_date);
      }
      for (const [name, v] of Object.entries(d.product_breakdown || {})) {
        if (!agg.product_breakdown[name]) agg.product_breakdown[name] = { quantity: 0, revenue: 0 };
        agg.product_breakdown[name].quantity += v.quantity || 0;
        agg.product_breakdown[name].revenue += v.revenue || 0;
      }
      agg.daily_revenue.push({ run_date: d.run_date, revenue: d.total_revenue || 0 });
    }
    agg.top5_products = Object.entries(agg.product_breakdown)
      .map(([name, v]) => ({
        product_name: name,
        quantity: v.quantity,
        revenue: v.revenue,
        revenue_share_pct: agg.total_revenue ? Math.round(v.revenue / agg.total_revenue * 1000) / 10 : null,
      }))
      .sort((a, b) => b.quantity - a.quantity)
      .slice(0, 5);
    return agg;
  }

  // ---------------------------------------------------------------------
  // 렌더링 (기간 선택에 따라 반복 호출됨)
  // ---------------------------------------------------------------------
  function renderView(agg, opts) {
    const isMulti = opts.isMulti;
    const dayCount = agg.dates.length;

    document.getElementById("runDate").textContent = opts.label;

    // 총 매출액
    const hero = document.getElementById("heroRevenue");
    clear(hero);
    const revenueStr = (agg.total_revenue || 0).toLocaleString("ko-KR");
    hero.appendChild(el("div", "label", isMulti ? "총 매출액 (기간 합산)" : "총 매출액"));
    hero.appendChild(el("div", "value", `${revenueStr}<span class="unit">원</span>`));
    if (isMulti && dayCount > 0) {
      const avg = Math.round((agg.total_revenue || 0) / dayCount).toLocaleString("ko-KR");
      hero.appendChild(el("div", "avg", `일평균 ${avg}원 (${dayCount}일 기준)`));
    }
    if (agg.revenue_missing_count > 0) {
      hero.appendChild(el(
        "div", "caveat",
        `※ 금액 정보가 없는 주문 ${agg.revenue_missing_count}건은 제외된 금액입니다`
      ));
    }

    // 상단 통계 타일
    const tiles = document.getElementById("tiles");
    clear(tiles);
    const vendorCount = Object.keys(agg.vendor_order_counts || {}).length;
    const needsReview = (agg.unclassified_count || 0) + (agg.ambiguous_count || 0);
    const tileDefs = [["전체 주문", agg.total_order_count, false]];
    if (!isMulti) {
      tileDefs.push(
        ["처리 라인 수", agg.total_line_count, false],
        ["분류된 협력사", vendorCount, false],
        ["확인 필요", needsReview, true],
      );
    }
    tileDefs.forEach(([label, value, isWarn]) => {
      const t = el("div", "tile" + (isWarn && value > 0 ? " chip-warn" : ""));
      t.appendChild(el("div", "label", label));
      t.appendChild(el("div", "value" + (isWarn && value > 0 ? " warn" : ""), String(value)));
      tiles.appendChild(t);
    });

    // 추이 차트 (기간이 2일 이상일 때만)
    const trendPanel = document.getElementById("trendPanel");
    if (isMulti && agg.daily_revenue.length > 1) {
      trendPanel.hidden = false;
      document.getElementById("trendSub").textContent = `${opts.label} · ${dayCount}일`;
      const chart = document.getElementById("trendChart");
      const axis = document.getElementById("trendAxis");
      clear(chart); clear(axis);
      const maxRev = Math.max(...agg.daily_revenue.map(d => d.revenue), 1);
      const tooltip = document.getElementById("tooltip");
      agg.daily_revenue.forEach(d => {
        const wrap = el("div", "trend-bar-wrap");
        const bar = el("div", "trend-bar");
        bar.style.height = Math.max((d.revenue / maxRev) * 100, 2) + "%";
        wrap.appendChild(bar);
        wrap.addEventListener("mousemove", (e) => {
          tooltip.style.display = "block";
          tooltip.style.left = (e.clientX + 12) + "px";
          tooltip.style.top = (e.clientY + 12) + "px";
          tooltip.textContent = `${fmtDateLabel(d.run_date)} · ${d.revenue.toLocaleString("ko-KR")}원`;
        });
        wrap.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
        chart.appendChild(wrap);
      });
      const first = agg.daily_revenue[0].run_date;
      const last = agg.daily_revenue[agg.daily_revenue.length - 1].run_date;
      axis.appendChild(el("span", null, fmtShortDate(first)));
      if (agg.daily_revenue.length > 2) axis.appendChild(el("span", null, fmtShortDate(last)));
    } else {
      trendPanel.hidden = true;
    }

    // 바 차트
    function renderBars(containerId, counts) {
      const container = document.getElementById(containerId);
      clear(container);
      const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
      if (entries.length === 0) {
        container.appendChild(el("div", "empty-note", "데이터 없음"));
        return;
      }
      const max = Math.max(...entries.map(([, v]) => v));
      entries.forEach(([name, count]) => {
        const row = el("div", "bar-row");
        row.appendChild(el("div", "name", name));
        const track = el("div", "bar-track");
        const fill = el("div", "bar-fill");
        fill.style.width = (max ? (count / max) * 100 : 0) + "%";
        track.appendChild(fill);
        row.appendChild(track);
        row.appendChild(el("div", "count", String(count)));
        container.appendChild(row);
      });
    }
    renderBars("marketBars", agg.market_order_counts);
    renderBars("vendorBars", agg.vendor_order_counts);

    // TOP5
    document.getElementById("top5Sub").textContent =
      (isMulti ? `${opts.label} 합산 · ` : "") + "전체 마켓 합산 판매수량 기준";
    const top5El = document.getElementById("top5");
    clear(top5El);
    const top5 = agg.top5_products || [];
    if (top5.length === 0) {
      top5El.appendChild(el("div", "empty-note", "데이터 없음"));
    } else {
      const maxQty = Math.max(...top5.map(p => p.quantity));
      top5.forEach((p, i) => {
        const row = el("div", "lb-row");
        row.appendChild(el("div", "lb-rank", String(i + 1)));
        const main = el("div", "lb-main");
        main.appendChild(el("div", "lb-name", p.product_name));
        const track = el("div", "lb-track");
        const fill = el("div", "lb-fill");
        fill.style.width = (maxQty ? (p.quantity / maxQty) * 100 : 0) + "%";
        track.appendChild(fill);
        main.appendChild(track);
        row.appendChild(main);

        const qtyWrap = el("div", "lb-qty-wrap");
        qtyWrap.appendChild(el("div", "lb-qty", `${p.quantity}<span class="unit">개</span>`));
        const shareText = p.revenue_share_pct != null ? `매출 ${p.revenue_share_pct}%` : "매출 정보 없음";
        qtyWrap.appendChild(el("div", "lb-share" + (p.revenue_share_pct == null ? " muted" : ""), shareText));
        row.appendChild(qtyWrap);

        top5El.appendChild(row);
      });
    }

    // 대조 결과 칩
    const reconChip = document.getElementById("reconChip");
    clear(reconChip);
    if (agg.reconciliation_all_match) {
      reconChip.appendChild(el(
        "span", "status-chip good",
        `<span class="dot"></span>원본 대조 완료 · 누락 없음`
      ));
    } else {
      reconChip.appendChild(el(
        "span", "status-chip critical",
        `<span class="dot"></span>대조 불일치 (${agg.mismatched_dates.join(", ")})`
      ));
    }

    // 작업 완료 리포트 (강조 표시 범례 + 특이사항/정보 누락) — 당일 조회일 때만 노출
    const reportSection = document.getElementById("reportSection");
    reportSection.hidden = isMulti;
    if (isMulti) return;

    const ht = agg.highlight_totals || {};
    document.getElementById("legendQty").textContent = `수량 2개 이상: ${ht.quantity || 0}건`;
    document.getElementById("legendDup").textContent = `동일 수령인·주소 중복: ${ht.duplicate_address || 0}건`;
    document.getElementById("legendBoth").textContent = `둘 다 해당: ${ht.both || 0}건`;

    function renderNoteList(containerId, titleId, titleLabel, items, rowRenderer) {
      const container = document.getElementById(containerId);
      clear(container);
      document.getElementById(titleId).textContent = `${titleLabel} (${items.length}건)`;
      if (items.length === 0) {
        container.appendChild(el("div", "empty-note", "해당 없음"));
        return;
      }
      items.forEach(item => container.appendChild(rowRenderer(item)));
    }

    renderNoteList("notesList", "notesTitle", "특이사항 (배송메시지)", agg.special_notes || [], (n) => {
      const row = el("div", "note-item");
      row.appendChild(el("div", "n-who", n.receiver_name || "-"));
      row.appendChild(el("div", "n-what", `${n.product_name || ""} · ${n.message}`));
      row.appendChild(el("div", "n-flag", n.order_id || ""));
      return row;
    });

    renderNoteList("missingList", "missingTitle", "정보 누락 확인 필요", agg.missing_info || [], (n) => {
      const row = el("div", "note-item");
      row.appendChild(el("div", "n-who", n.receiver_name || "(수령인명 없음)"));
      row.appendChild(el("div", "n-what", n.product_name || ""));
      row.appendChild(el("div", "n-flag", (n.missing_fields || []).join(", ") + " 없음"));
      return row;
    });
  }

  // ---------------------------------------------------------------------
  // 기간 계산
  // ---------------------------------------------------------------------
  function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
  function toKey(date) {
    const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, "0"), d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function selectRange(allDocs, rangeKey, latestDate) {
    if (rangeKey && typeof rangeKey === "object") {
      return allDocs.filter(d => d.run_date >= rangeKey.start && d.run_date <= rangeKey.end);
    }
    if (rangeKey === "today") {
      return allDocs.filter(d => d.run_date === toKey(latestDate));
    }
    if (rangeKey === "week") {
      const start = toKey(addDays(latestDate, -6));
      return allDocs.filter(d => d.run_date >= start && d.run_date <= toKey(latestDate));
    }
    if (rangeKey === "month") {
      const y = latestDate.getFullYear(), m = latestDate.getMonth();
      return allDocs.filter(d => { const dd = parseDate(d.run_date); return dd.getFullYear() === y && dd.getMonth() === m; });
    }
    if (rangeKey === "quarter") {
      const y = latestDate.getFullYear(), q = Math.floor(latestDate.getMonth() / 3);
      return allDocs.filter(d => { const dd = parseDate(d.run_date); return dd.getFullYear() === y && Math.floor(dd.getMonth() / 3) === q; });
    }
    // 특정 날짜 선택
    return allDocs.filter(d => d.run_date === rangeKey);
  }

  // ---------------------------------------------------------------------
  // 초기화: db capability로 과거 기록을 불러오고, 없으면 오늘 데이터만 사용
  // ---------------------------------------------------------------------
  async function init() {
    let allDocs = [embeddedSummary];
    let dbAvailable = false;
    try {
      const db = await claude.use("db");
      if (db) {
        const snap = await db.collection("daily_summaries").orderBy("run_date", "asc").limit(400).get();
        const docs = snap.docs.map(d => d.data()).filter(Boolean);
        if (docs.length > 0) {
          allDocs = docs;
          dbAvailable = true;
        }
      }
    } catch (e) {
      // db 사용 불가 -> 오늘 데이터만으로 렌더링
    }

    const dates = [...new Set(allDocs.map(d => d.run_date))].sort();
    const latestDate = parseDate(dates[dates.length - 1]);

    const rangeBar = document.getElementById("rangeBar");
    const rangeNote = document.getElementById("rangeNote");
    const dateBtn = document.getElementById("dateBtn");
    const calendarPop = document.getElementById("calendarPop");
    const calLabel = document.getElementById("calLabel");
    const calGrid = document.getElementById("calGrid");
    const calPrev = document.getElementById("calPrev");
    const calNext = document.getElementById("calNext");
    const calHint = document.getElementById("calHint");

    const availableDates = new Set(dates);
    const minD = parseDate(dates[0]);
    const maxD = latestDate;
    let calYear = maxD.getFullYear();
    let calMonth = maxD.getMonth();
    let pendingStart = null;   // 두 번 클릭 중 첫 번째로 고른 날짜 (종료일 선택 대기 중)
    let selectedRange = null;  // 완료된 선택 {start, end} — 팝오버 다시 열 때 표시용

    if (dbAvailable && dates.length > 1) {
      rangeBar.hidden = false;
      rangeNote.textContent = `${dates.length}일치 기록 보유 (${fmtShortDate(dates[0])} ~ ${fmtShortDate(dates[dates.length - 1])})`;
    } else if (!dbAvailable) {
      rangeNote.textContent = "";
    }

    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
    function renderCalendar() {
      calLabel.textContent = `${calYear}년 ${calMonth + 1}월`;
      calPrev.disabled = calYear === minD.getFullYear() && calMonth === minD.getMonth();
      calNext.disabled = calYear === maxD.getFullYear() && calMonth === maxD.getMonth();
      clear(calGrid);
      WEEKDAYS.forEach(w => calGrid.appendChild(el("div", "cal-weekday", w)));

      const firstDow = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      for (let i = 0; i < firstDow; i++) calGrid.appendChild(el("div", "cal-day empty-day"));
      for (let day = 1; day <= daysInMonth; day++) {
        const dstr = toKey(new Date(calYear, calMonth, day));
        const hasData = availableDates.has(dstr);
        const cls = ["cal-day"];
        if (hasData) cls.push("has-data"); else cls.push("no-data");
        if (pendingStart) {
          if (dstr === pendingStart) cls.push("pending-start");
        } else if (selectedRange) {
          if (dstr >= selectedRange.start && dstr <= selectedRange.end) cls.push("in-range");
          if (dstr === selectedRange.start || dstr === selectedRange.end) cls.push("range-edge");
        }
        const cell = el("button", cls.join(" "), String(day));
        cell.type = "button";
        if (hasData) {
          cell.addEventListener("click", (e) => {
            // 이 클릭으로 캘린더가 다시 그려지면서 클릭된 버튼 자신이 DOM에서
            // 제거되므로, 버블링을 막지 않으면 document의 "바깥 클릭 감지"
            // 핸들러가 detached된 e.target을 보고 팝오버를 즉시 닫아버린다.
            e.stopPropagation();
            onDayClick(dstr);
          });
        } else {
          cell.disabled = true;
        }
        calGrid.appendChild(cell);
      }

      if (pendingStart) {
        calHint.hidden = false;
        calHint.innerHTML = `시작일 <b>${fmtDateLabel(pendingStart)}</b> 선택됨 · 종료일을 클릭하세요<br>(같은 날짜를 다시 누르면 하루만 조회)`;
      } else {
        calHint.hidden = true;
      }
    }

    function onDayClick(dstr) {
      if (pendingStart === null) {
        pendingStart = dstr;
        renderCalendar();
        return;
      }
      let start = pendingStart, end = dstr;
      if (start > end) { const t = start; start = end; end = t; }
      pendingStart = null;
      calendarPop.hidden = true;
      applyCustomRange(start, end);
    }

    calPrev.addEventListener("click", () => {
      calMonth -= 1;
      if (calMonth < 0) { calMonth = 11; calYear -= 1; }
      renderCalendar();
    });
    calNext.addEventListener("click", () => {
      calMonth += 1;
      if (calMonth > 11) { calMonth = 0; calYear += 1; }
      renderCalendar();
    });
    dateBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (calendarPop.hidden) {
        calendarPop.hidden = false;
        renderCalendar();
      } else {
        calendarPop.hidden = true;
        pendingStart = null;
      }
    });
    document.addEventListener("click", (e) => {
      if (!document.getElementById("datePicker").contains(e.target) && !calendarPop.hidden) {
        calendarPop.hidden = true;
        pendingStart = null;
      }
    });

    function apply(rangeKey) {
      document.querySelectorAll(".range-btn").forEach(b => b.classList.toggle("active", b.dataset.range === rangeKey));
      dateBtn.classList.remove("active");
      dateBtn.textContent = "📅 날짜 선택";
      pendingStart = null;
      selectedRange = null;
      const docs = selectRange(allDocs, rangeKey, latestDate);
      const agg = aggregate(docs);
      const labels = { today: "오늘", week: "최근 7일", month: "이번 달", quarter: "이번 분기" };
      let label;
      if (docs.length === 0) {
        label = "데이터 없음";
      } else if (docs.length === 1) {
        label = `${fmtDateLabel(docs[0].run_date)} 처리 결과`;
      } else {
        label = `${labels[rangeKey] || rangeKey} (${fmtShortDate(docs[0].run_date)} ~ ${fmtShortDate(docs[docs.length - 1].run_date)}) 처리 결과`;
      }
      renderView(agg, { isMulti: docs.length > 1, label });
    }

    function applyCustomRange(start, end) {
      document.querySelectorAll(".range-btn").forEach(b => b.classList.remove("active"));
      dateBtn.classList.add("active");
      selectedRange = { start, end };
      dateBtn.textContent = start === end
        ? `📅 ${fmtDateLabel(start)}`
        : `📅 ${fmtShortDate(start)} ~ ${fmtShortDate(end)}`;
      const docs = selectRange(allDocs, { start, end }, latestDate);
      const agg = aggregate(docs);
      const label = start === end
        ? `${fmtDateLabel(start)} 처리 결과`
        : `${fmtDateLabel(start)} ~ ${fmtDateLabel(end)} 처리 결과`;
      renderView(agg, { isMulti: docs.length > 1, label });
    }

    document.querySelectorAll(".range-btn").forEach(btn => {
      btn.addEventListener("click", () => apply(btn.dataset.range));
    });

    apply("today");
  }

  init();
</script>
