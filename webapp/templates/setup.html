{% extends "base.html" %}
{% block content %}
<div class="card auth-card" style="box-shadow: 0 1px 2px rgba(20,30,40,0.04), 0 12px 32px rgba(20,30,40,0.07);">
  <div style="width:46px; height:46px; border-radius:13px; background:var(--cyan-500); display:flex; align-items:center; justify-content:center; margin-bottom:18px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4.5 7.5 12 12l7.5-4.5"/><path d="M12 12v9"/></svg>
  </div>
  <h1>처음 설정 — 관리자 계정 만들기</h1>
  <p class="muted" style="margin-bottom:20px;">아직 계정이 하나도 없습니다. 가장 먼저 쓸 관리자 계정을 만들어주세요. 이후 직원 계정은 이 계정으로 로그인해서 "사용자 관리"에서 추가할 수 있습니다.</p>

  {% if error %}<div class="note error">{{ error }}</div>{% endif %}

  <form method="post" action="/setup" style="display:flex; flex-direction:column; gap:14px;">
    <label>
      <div style="margin-bottom:6px;">아이디</div>
      <input type="text" name="username" required class="field" style="width:100%;">
    </label>
    <label>
      <div style="margin-bottom:6px;">이름 (표시용, 생략 가능)</div>
      <input type="text" name="display_name" class="field" style="width:100%;">
    </label>
    <label>
      <div style="margin-bottom:6px;">비밀번호 (4자 이상)</div>
      <input type="password" name="password" required minlength="4" class="field" style="width:100%;">
    </label>
    <button type="submit" class="btn" style="width:100%; height:46px; margin-top:6px;">관리자 계정 만들기</button>
  </form>
</div>
{% endblock %}
